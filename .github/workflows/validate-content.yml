name: Validate portfolio content

# Pushes to main are validated by deploy-pages.yml before publishing.
on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate SEO and structured content
        run: python3 scripts/validate_content.py
