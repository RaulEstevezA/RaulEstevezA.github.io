name: Deploy site to GitHub Pages

# Fills the generated blocks of the HTML pages from data/*.json and publishes
# the result. The filled pages are only published, never committed.
# Requires Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Demo and tool deployments can push several commits in a row: queue the
# deployments instead of cancelling one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history: sitemap.xml dates come from the last commit of each page.
          fetch-depth: 0

      - name: Validate SEO and structured content
        run: python3 scripts/validate_content.py

      - name: Pre-render data/*.json into the HTML pages
        run: python3 scripts/build_content.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
