name: Deploy portfolio and demos to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-demos]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4

      - name: Checkout E-Plant
        uses: actions/checkout@v4
        with:
          repository: RaulEstevezA/e-plantShopping
          ref: main
          path: .demo-sources/e-plantShopping

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: .demo-sources/e-plantShopping/package-lock.json

      - name: Install E-Plant dependencies
        working-directory: .demo-sources/e-plantShopping
        run: npm ci

      - name: Build E-Plant for its portfolio path
        working-directory: .demo-sources/e-plantShopping
        run: npm run build -- --base=/demos/e-plantShopping/

      - name: Assemble website
        run: |
          mkdir -p _site/demos/e-plantShopping
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.demo-sources/' \
            --exclude='_site/' \
            ./ _site/
          cp -a .demo-sources/e-plantShopping/dist/. _site/demos/e-plantShopping/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
